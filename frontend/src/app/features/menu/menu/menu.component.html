<div class="container mt-4">
  <h1 class="text-center mb-4">Choisissez une pizza</h1>

  <div class="d-flex justify-content-center mb-4 align-items-center">
    <span class="me-3" [class.fw-bold]="!isHalfHalfMode">Pizza Normale</span>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="halfHalfToggle" 
             [checked]="isHalfHalfMode" (change)="toggleHalfHalfMode()"
             style="width: 3em; height: 1.5em; cursor: pointer;">
    </div>
    <span class="ms-3" [class.fw-bold]="isHalfHalfMode">Moitié / Moitié</span>
  </div>

  <div class="row">
    <div *ngFor="let pizza of pizzas" class="col-md-3 col-sm-6 mb-4">
      <div class="card pizza-card" 
           [ngClass]="{'disabled': !isPizzaAvailable(pizza), 'selected-card': isSelected(pizza)}"
           (click)="isPizzaAvailable(pizza) && onPizzaSelected(pizza)">
        <img [src]="pizza.imageUrl" [alt]="pizza.name" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title text-center">{{ pizza.name }}</h5>
        </div>
      </div>
    </div>
  </div>
</div>
